name: PHP Lint & Code Quality

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.php'
      - '.github/workflows/php-lint.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.php'

jobs:
  lint:
    runs-on: ubuntu-latest
    name: PHP Syntax Check

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: phpcs, phpstan

      - name: PHP Syntax Check
        run: |
          find . -name "*.php" -type f | grep -v node_modules | while read file; do
            php -l "$file" || exit 1
          done

      - name: Check for Debug Code
        run: |
          if grep -r "var_dump\|print_r\|die(" app/ core/ --include="*.php" 2>/dev/null; then
            echo "Found debug code (var_dump, print_r, die)"
            exit 1
          fi

      - name: Check for Error Suppression
        run: |
          if grep -r "@\|@\$\|error_suppression" app/ core/ --include="*.php" 2>/dev/null | grep -v "TODO\|FIXME"; then
            echo "Found error suppression operators"
          fi

      - name: Verify MVC Structure
        run: |
          test -d app/Controllers
          test -d app/Models
          test -d app/Views
          test -d core
          test -d database
          test -f index.php

      - name: Summary Report
        if: always()
        run: |
          echo "## PHP Lint Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Results:" >> $GITHUB_STEP_SUMMARY
          echo "- **Syntax**: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Debug Code**: None found" >> $GITHUB_STEP_SUMMARY