name: Live Demo Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize ]

permissions:
  contents: read
  pull-requests: write

jobs:
  setup-demo:
    runs-on: ubuntu-latest
    name: Live Demo
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: demo_root
          MYSQL_DATABASE: mvc_demo
          MYSQL_USER: mvc_user
          MYSQL_PASSWORD: mvc_pass
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysql, mysqli, pdo_mysql
          tools: composer

      - name: Create DB config
        run: |
          cat > configs/database.php << 'EOF'
          <?php
          return [
              'host' => '127.0.0.1',
              'user' => 'mvc_user',
              'password' => 'mvc_pass',
              'database' => 'mvc_demo',
              'port' => 3306,
          ];
          EOF

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u mvc_user -pmvc_pass 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Setup Database
        run: |
          mysql -h 127.0.0.1 -u mvc_user -pmvc_pass mvc_demo < database/schema.sql
          mysql -h 127.0.0.1 -u mvc_user -pmvc_pass mvc_demo < database/seed.sql || true

      - name: Verify Project
        run: |
          php -v
          test -f index.php
          test -d app/Controllers
          test -d app/Models
          test -d app/Views
          test -d core

      - name: Verify Database
        run: |
          mysql -h 127.0.0.1 -u mvc_user -pmvc_pass mvc_demo -e "SHOW TABLES;"

      - name: Test PHP Server
        run: |
          timeout 5 php -S 127.0.0.1:8000 index.php &
          sleep 2
          curl -s http://127.0.0.1:8000/ | head -50 || true

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## Live Demo Status
            - PHP: 8.1
            - Database: MySQL 8.0 (mvc_demo)
            View logs in Actions tab`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })

      - name: Generate Summary
        if: always()
        run: |
          echo "## Live Demo Deploy" >> $GITHUB_STEP_SUMMARY
          echo "- PHP 8.1" >> $GITHUB_STEP_SUMMARY
          echo "- MySQL 8.0" >> $GITHUB_STEP_SUMMARY
